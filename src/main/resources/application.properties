spring.application.name=dispatch
server.port=${PORT:8080}

# H2 in memory by default, so the app runs with zero setup.
# Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD to use PostgreSQL instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:dispatch;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Batch inserts for large order lists
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
management.endpoints.web.exposure.include=health
